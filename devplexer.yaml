namespace: localstack-viewer
apps:
  localstack:
    command: localstack start
  server:
    working_directory: server
    command: LOCALSTACK_URL=http://localhost:4566 EVENT_SOURCE_AMQP_URL=amqp://guest:guest@localhost:5672 EVENT_SOURCE_VHOST=event_source cargo run
  ui-tailwind:
    working_directory: ui
    command: npx @tailwindcss/cli -i ./input.css -o ./assets/tailwind.css --watch
  ui:
    working_directory: ui
    command: dx serve --port 8080
