[package]
name = "localstack-viewer-data"
version = "0.1.0"
authors = ["Trey Evans <lewis.r.evans@gmail.com>"]
edition = "2021"
crate-type = "lib"

[dependencies]
serde_json = { version = "1.0.140", features = ["raw_value"] }
serde = { version = "1.0.219", features = ["derive"]}
rocket = { version = "0.5.1", optional = true }

[features]
default = []
server = ["rocket"]
